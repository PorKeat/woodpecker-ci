apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-api-ingress
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: argocd-argocd-vpn-only@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - backend:
          service:
            name: argo-argocd-server
            port:
              number: 80
        path: /argocd/api
        pathType: Prefix
  tls:
  - secretName: argocd-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: argocd-argocd-vpn-only@kubernetescrd,argocd-argocd-clear-root-cookie@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "50"
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - backend:
          service:
            name: argo-argocd-server
            port:
              number: 80
        path: /argocd
        pathType: Prefix
  tls:
  - secretName: argocd-tls
