agent:
  enabled: true
  replicaCount: 3
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - agent
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                    - woodpecker
            topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: agent
          app.kubernetes.io/instance: woodpecker
  image:
    repository: woodpeckerci/woodpecker-agent
    tag: v3.19.0
  podAnnotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/agent-inject-secret-woodpecker.env: secret/data/woodpecker
    vault.hashicorp.com/agent-inject-template-woodpecker.env: |
      {{- with secret "secret/data/woodpecker" -}}
      export WOODPECKER_SERVER_RPC_SECRET="{{ .Data.data.rpc_secret }}"
      {{- end -}}
    vault.hashicorp.com/agent-vault-addr: https://10.1.18.8:8200
    vault.hashicorp.com/role: woodpecker-role
    vault.hashicorp.com/tls-skip-verify: "true"
  env:
    WOODPECKER_SERVER: woodpecker-server:9000
    WOODPECKER_BACKEND: kubernetes
    WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: longhorn-ci
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: 10G
    WOODPECKER_MAX_WORKFLOWS: "2"
    WOODPECKER_BACKEND_K8S_PRIORITY_CLASS: ci-workload
    WOODPECKER_BACKEND_K8S_POD_AFFINITY: |
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: woodpecker-ci.org/step
                    operator: Exists
              topologyKey: kubernetes.io/hostname
server:
  enabled: true
  replicaCount: 1
  image:
    repository: woodpeckerci/woodpecker-server
    tag: v3.19.0
  persistentVolume:
    enabled: false
  podAnnotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/agent-inject-secret-woodpecker.env: secret/data/woodpecker
    vault.hashicorp.com/agent-inject-template-woodpecker.env: |
      {{- with secret "secret/data/woodpecker" -}}
      export WOODPECKER_SERVER_RPC_SECRET="{{ .Data.data.rpc_secret }}"
      export WOODPECKER_GITHUB_CLIENT="{{ .Data.data.github_client_id }}"
      export WOODPECKER_GITHUB_SECRET="{{ .Data.data.github_client_secret }}"
      {{- end -}}
    vault.hashicorp.com/agent-vault-addr: https://10.1.18.8:8200
    vault.hashicorp.com/role: woodpecker-role
    vault.hashicorp.com/tls-skip-verify: "true"
  env:
    WOODPECKER_ADMIN: PorKeat
    WOODPECKER_DATABASE_DATASOURCE: postgres://woodpecker:X6cH39koXXFS1qECuyQTljIMaPSmRJeMQWmGWGvClI8GibQz8xb5eIq5i27exjmH@woodpecker-db-rw:5432/woodpecker?sslmode=disable
    WOODPECKER_DATABASE_DRIVER: postgres
    WOODPECKER_GITHUB: "true"
    WOODPECKER_HOST: https://woodpecker.unity-workspace.com
    WOODPECKER_OPEN: "true"
    WOODPECKER_ORGS: unity-workspace-org
    WOODPECKER_SERVER_ADDR: :8000
    WOODPECKER_SERVER_RPC_ADDR: :9000
