# ArgoCD Application Manifest
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/PorKeat/gitops-deployments.git
    targetRevision: HEAD
    path: apps/sample-service
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true      # Automatically remove resources deleted from Git
      selfHeal: true   # Automatically revert manual kubectl changes back to Git state
    syncOptions:
      - CreateNamespace=true
