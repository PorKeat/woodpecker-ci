# .woodpecker.yaml for Node.js Applications
when:
  event: [push]
  branch: main

steps:
  - name: test
    image: node:20-alpine
    commands:
      - npm ci
      - npm test

  - name: kaniko-build
    image: gcr.io/kaniko-project/executor:v1.23.2-debug
    commands:
      - /kaniko/executor \
          --context=dir://. \
          --dockerfile=Dockerfile \
          --destination=ghcr.io/porkeat/node-app:${CI_COMMIT_SHA:0:7}
    environment:
      DOCKER_CONFIG:
        from_secret: docker_config

  - name: gitops-bump
    image: alpine/git:v2.45.2
    commands:
      - git config --global user.name "Woodpecker CI"
      - git config --global user.email "ci@local"
      - git clone https://$$GITHUB_TOKEN@github.com/PorKeat/gitops-deployments.git
      - cd gitops-deployments
      - sed -i "s|image: ghcr.io/porkeat/node-app:.*|image: ghcr.io/porkeat/node-app:${CI_COMMIT_SHA:0:7}|g" apps/node-app/deployment.yaml
      - git commit -am "chore(release): bump node-app to ${CI_COMMIT_SHA:0:7} [skip ci]"
      - git push origin main
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
